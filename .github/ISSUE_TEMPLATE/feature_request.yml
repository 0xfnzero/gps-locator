name: Feature request
description: Suggest an improvement to GPS Locator
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What development or QA workflow is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change. GPS Locator stays open-source, with no ads or paid unlocks.
    validations:
      required: true
